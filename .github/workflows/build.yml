name: Build & Audit Windows XP Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-xp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64 & Tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 cmake ninja-build python3 wine wine32:i386 wine64

      - name: Build XP Static Dependencies (mbedTLS + libcurl)
        run: ./scripts/build_deps.sh

      - name: Build XPAgent
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-xp.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Audit Windows XP SP3 PE Imports
        run: |
          python3 scripts/check_xp_imports.py build/xpagent.exe
          python3 scripts/check_xp_imports.py build/xpagent_tests.exe

      - name: Run Unit Tests in Wine
        run: WINEARCH=win32 WINEDEBUG=-all wine build/xpagent_tests.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpagent-winxp-x86
          path: build/xpagent.exe
